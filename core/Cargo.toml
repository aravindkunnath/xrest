[workspace]
resolver = "2"
members = ["xrest-core", "xrest-ffi", "uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "gzip", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
serde_yaml_ng = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
wiremock = "0.6"
uniffi = "0.32"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
